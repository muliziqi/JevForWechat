name: Build JevForWechat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q JevForWechat-GitHub-A0.zip -d project

      - name: Fix compile SDK
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' \
            project/JevForWechat-GitHub-A0/app/build.gradle.kts

      - name: Build APK
        working-directory: project/JevForWechat-GitHub-A0
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JevForWechat-A0-debug
          path: project/JevForWechat-GitHub-A0/app/build/outputs/apk/debug/app-debug.apk
